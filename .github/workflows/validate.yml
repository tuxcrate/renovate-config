name: Validate Renovate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/renovatebot/renovate:44.166.0@sha256:510b885a90cd70437816c5c2da1d0c3beff513d3979497b2db1d37c84adfbc2b
      # Checkout needs access to the runner-owned workspace and command files.
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate presets and repository configuration
        run: renovate-config-validator --strict --no-global default.json images.json renovate.json
      - name: Test custom manager extraction and replacement
        run: node --test tests/*.test.cjs
