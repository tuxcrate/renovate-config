name: Validate Renovate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/renovatebot/renovate:44.165.3@sha256:dc5851d4f6019568a573be14129b889113e897507a4db856fb5699eaa4648849
      # Checkout needs access to the runner-owned workspace and command files.
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate presets and repository configuration
        run: renovate-config-validator --strict --no-global default.json images.json renovate.json
      - name: Test custom manager extraction and replacement
        run: node --test tests/*.test.cjs
